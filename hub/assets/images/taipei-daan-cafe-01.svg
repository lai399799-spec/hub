<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="簡光 Roaster 封面插圖：手沖咖啡與濾杯">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ecc9"/>
      <stop offset="1" stop-color="#f4dcd6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1260" cy="260" r="150" fill="#fffdf8" opacity=".55"/>
  <rect x="0" y="760" width="1600" height="240" fill="#e9d6bb"/>
  <rect x="0" y="750" width="1600" height="14" fill="#d8c1a0"/>
  <!-- 手沖壺 -->
  <g transform="translate(980 250)">
    <path d="M0 120 Q0 60 60 60 L190 60 Q250 60 250 120 L250 280 Q250 340 190 340 L60 340 Q0 340 0 280 Z" fill="#8a9a78"/>
    <path d="M250 150 Q330 130 380 60 L400 80 Q350 180 250 210 Z" fill="#7a8a68"/>
    <path d="M0 140 Q-70 140 -70 230 Q-70 300 0 300" fill="none" stroke="#6f7f5e" stroke-width="22" stroke-linecap="round"/>
    <rect x="70" y="30" width="110" height="34" rx="14" fill="#6f7f5e"/>
  </g>
  <!-- 水流 -->
  <path d="M1385 320 Q1400 520 1190 640" fill="none" stroke="#fffdf8" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <!-- 濾杯 + 咖啡壺 -->
  <g transform="translate(800 520)">
    <path d="M60 0 L340 0 L270 130 L130 130 Z" fill="#fffdf8" stroke="#c0713f" stroke-width="10" stroke-linejoin="round"/>
    <rect x="150" y="130" width="100" height="30" rx="8" fill="#c0713f"/>
    <path d="M110 160 L290 160 L310 230 Q312 250 292 250 L108 250 Q88 250 90 230 Z" fill="#fffdf8" opacity=".6" stroke="#c0713f" stroke-width="8"/>
    <path d="M118 190 L282 190 L292 230 Q293 240 283 240 L117 240 Q107 240 108 230 Z" fill="#6b4630"/>
  </g>
  <!-- 小杯子 -->
  <g transform="translate(360 640)">
    <path d="M0 0 L190 0 L175 100 Q170 120 150 120 L40 120 Q20 120 15 100 Z" fill="#fffdf8" stroke="#c0713f" stroke-width="8"/>
    <path d="M190 20 Q250 20 245 65 Q240 100 180 95" fill="none" stroke="#c0713f" stroke-width="8"/>
    <path d="M10 18 L180 18 L176 40 L14 40 Z" fill="#6b4630"/>
